<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Clean Deep Obsidian Icon Surface (No Outer Blur) -->
    <linearGradient id="iconSurface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1838" />
      <stop offset="55%" stop-color="#120F22" />
      <stop offset="100%" stop-color="#0B0914" />
    </linearGradient>

    <linearGradient id="iconEdge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C4B5FD" stop-opacity="0.38" />
      <stop offset="50%" stop-color="#7C3AED" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#34D399" stop-opacity="0.32" />
    </linearGradient>

    <!-- Heatmap Tile Gradients -->
    <linearGradient id="tileLow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4C1D95" stop-opacity="0.72" />
      <stop offset="100%" stop-color="#2E1065" stop-opacity="0.68" />
    </linearGradient>

    <linearGradient id="tileMed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#5B21B6" />
    </linearGradient>

    <linearGradient id="tileHigh" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA" />
      <stop offset="55%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#6D28D9" />
    </linearGradient>

    <linearGradient id="tilePeak" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="55%" stop-color="#9333EA" />
      <stop offset="100%" stop-color="#6B21A8" />
    </linearGradient>

    <!-- Emerald Checkmark Tile -->
    <linearGradient id="heroEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7" />
      <stop offset="45%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Golden Flame Tile -->
    <linearGradient id="flameGold" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="45%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
  </defs>

  <!-- Rounded-Edge App Icon Only (Transparent Corners, No Outer Blur Background) -->
  <rect
    x="4"
    y="4"
    width="504"
    height="504"
    rx="114"
    fill="url(#iconSurface)"
    stroke="url(#iconEdge)"
    stroke-width="4"
  />

  <!-- 3x3 Sculpted Habit Heatmap Matrix -->
  <g transform="translate(82, 82)">
    <!-- Row 1 -->
    <rect x="0" y="0" width="100" height="100" rx="28" fill="url(#tileLow)" stroke="#A78BFA" stroke-opacity="0.28" stroke-width="2" />
    <rect x="124" y="0" width="100" height="100" rx="28" fill="url(#tileMed)" stroke="#C4B5FD" stroke-opacity="0.4" stroke-width="2" />
    <!-- Top-Right Tile: Golden Streak Flame Badge -->
    <g>
      <rect x="248" y="0" width="100" height="100" rx="28" fill="url(#flameGold)" stroke="#FEF08A" stroke-opacity="0.72" stroke-width="2.5" />
      <path
        d="M298 22 C298 22 320 41 317 62 C316 74 307 82 298 82 C288 82 279 74 279 61 C279 52 285 45 285 45 C285 45 284 54 290 57 C287 45 298 22 298 22 Z"
        fill="#FFFFFF"
      />
    </g>

    <!-- Row 2 -->
    <rect x="0" y="124" width="100" height="100" rx="28" fill="url(#tileMed)" stroke="#C4B5FD" stroke-opacity="0.4" stroke-width="2" />
    <rect x="124" y="124" width="100" height="100" rx="28" fill="url(#tileHigh)" stroke="#DDD6FE" stroke-opacity="0.55" stroke-width="2.5" />
    <rect x="248" y="124" width="100" height="100" rx="28" fill="url(#tilePeak)" stroke="#F3E8FF" stroke-opacity="0.65" stroke-width="2.5" />

    <!-- Row 3 -->
    <rect x="0" y="248" width="100" height="100" rx="28" fill="url(#tileHigh)" stroke="#DDD6FE" stroke-opacity="0.55" stroke-width="2.5" />
    <rect x="124" y="248" width="100" height="100" rx="28" fill="url(#tilePeak)" stroke="#F3E8FF" stroke-opacity="0.65" stroke-width="2.5" />

    <!-- Bottom-Right Tile: Luminous Emerald Completed Checkmark Badge -->
    <g>
      <rect x="248" y="248" width="100" height="100" rx="28" fill="url(#heroEmerald)" stroke="#A7F3D0" stroke-opacity="0.82" stroke-width="3" />
      <path
        d="M278 298 L292 312 L319 282"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="12"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </g>
  </g>
</svg>
